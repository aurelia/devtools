<template>
  <div if.bind="extensionInvalidated" class="notice notice-error" role="alert">
    <p class="notice-title">Extension was reloaded</p>
    <p>Close and reopen DevTools to reconnect the Aurelia pane.</p>
  </div>

  <div if.bind="isChecking" class="notice" aria-live="polite">
    <p>Looking for Aurelia…</p>
  </div>

  <div if.bind="isNotFound" class="notice">
    <p class="notice-title">No Aurelia application detected</p>
    <p>If the app is running, reload the page with DevTools open so the extension can attach.</p>
  </div>

  <div if.bind="isDisabled" class="notice">
    <p class="notice-title">Aurelia DevTools is disabled on this page</p>
    <p>The application opted out with the aurelia-devtools meta tag or a global flag.</p>
  </div>

  <div if.bind="isDetected" class="sidebar">
    <div class="toolbar" role="toolbar" aria-label="Aurelia inspector">
      <button type="button"
              class="tool-btn ${isElementPickerActive ? 'active' : ''}"
              aria-pressed="${isElementPickerActive}"
              title="Pick an element on the page"
              click.trigger="toggleElementPicker()">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M3 2.5l10 4.2-4.3 1.6L7 12.8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="search">
        <input type="text"
               class="search-input"
               placeholder="Find component"
               aria-label="Find component"
               aria-expanded="${isSearchOpen}"
               autocomplete="off"
               spellcheck="false"
               value.bind="searchQuery"
               input.trigger="onSearchInput($event)"
               keydown.trigger="onSearchKeydown($event)"
               focus.trigger="openSearch()"
               blur.trigger="closeSearch()">
        <button if.bind="searchQuery"
                type="button"
                class="search-clear"
                title="Clear"
                aria-label="Clear search"
                mousedown.trigger="$event.preventDefault()"
                click.trigger="clearSearch()">×</button>

        <div if.bind="isSearchOpen && searchResults.length" class="search-dropdown" role="listbox">
          <div repeat.for="result of searchResults"
               class="search-result ${$index === activeSearchIndex ? 'active' : ''}"
               role="option"
               aria-selected="${$index === activeSearchIndex}"
               mouseenter.trigger="setActiveSearchIndex($index)"
               mousedown.trigger="selectSearchResult(result, $event)">
            <span class="result-kind ${result.type}">${result.type === 'custom-attribute' ? 'attr' : 'el'}</span>
            <span class="result-name">${result.name}</span>
          </div>
        </div>
      </div>

      <button type="button"
              class="tool-btn ${followChromeSelection ? 'active' : ''}"
              aria-pressed="${followChromeSelection}"
              title="Follow the Elements panel selection"
              click.trigger="toggleFollowChromeSelection()">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M6.5 9.5l3-3M5 8l-1.5 1.5a2.1 2.1 0 0 0 3 3L8 11M8 5l1.5-1.5a2.1 2.1 0 0 1 3 3L11 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>

      <span class="toolbar-version" title="Detected framework version">${versionLabel}</span>
    </div>

    <section if.bind="hasComponentTree" class="tree">
      <div class="tree-header">
        <button type="button"
                class="tree-toggle"
                aria-expanded="${isTreePanelExpanded}"
                click.trigger="toggleTreePanel()">
          <span class="disclosure ${isTreePanelExpanded ? 'open' : ''}"></span>
          <span class="tree-title">Components</span>
          <span class="tree-count">${componentTreeCount}</span>
        </button>
        <button type="button"
                class="icon-btn"
                title="Refresh component tree"
                aria-label="Refresh component tree"
                click.trigger="loadComponentTree()">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path d="M13 8a5 5 0 1 1-1.5-3.6M13 3v2.5h-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div if.bind="isTreePanelExpanded" class="tree-body" role="tree">
        <div repeat.for="row of treeRows"
             class="tree-node ${row.node.key === selectedTreeNodeKey ? 'selected' : ''}"
             role="treeitem"
             tabindex="0"
             aria-selected="${row.node.key === selectedTreeNodeKey}"
             aria-level="${row.depth + 1}"
             style="padding-left: ${6 + row.depth * 14}px"
             click.trigger="selectTreeNode(row.node)"
             keydown.trigger="onTreeKeydown($event, row.node)">
          <button if.bind="row.node.hasChildren"
                  type="button"
                  tabindex="-1"
                  class="disclosure ${expandedTreeKeys[row.node.key] ? 'open' : ''}"
                  aria-label="Toggle children of ${row.node.name}"
                  click.trigger="toggleTreeNode(row.node, $event)"></button>
          <span else class="disclosure-spacer"></span>
          <span class="node-name ${row.node.type}">${row.node.name}</span>
          <span if.bind="row.node.type === 'custom-attribute'" class="node-kind">attr</span>
        </div>
      </div>
    </section>

    <div if.bind="!selectedElement" class="empty">
      <p>Select an element in the Elements panel, or use the picker, to inspect its Aurelia component and binding context.</p>
    </div>

    <div if.bind="selectedElement" class="inspector">
      <div class="component-header">
        <div class="component-identity">
          <div class="component-title">
            <span class="component-name">${selectedElement.name}</span>
            <span class="component-kind">${selectedKindLabel}</span>
          </div>
          <div if.bind="isShowingBindingContext" class="context-note">
            Binding context for <span class="context-tag">&lt;${selectedElementTagName}&gt;</span>
          </div>
        </div>
        <div class="header-actions">
          <button type="button"
                  class="icon-btn"
                  title="Reveal in Elements panel"
                  aria-label="Reveal in Elements panel"
                  click.trigger="revealInElements()">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <path d="M5 3L2.5 8 5 13M11 3l2.5 5L11 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button"
                  class="icon-btn ${isExportCopied ? 'copied' : ''}"
                  title="${isExportCopied ? 'Copied to clipboard' : 'Copy component as JSON'}"
                  aria-label="Copy component as JSON"
                  click.trigger="exportComponentAsJson()">
            <svg if.bind="!isExportCopied" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <rect x="2.5" y="2.5" width="8" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
              <path d="M6 5h6.5a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6" fill="none" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            <svg else viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="sections">
        <section if.bind="hasBindables" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.bindables}" click.trigger="toggleSection('bindables')">
            <span class="disclosure ${expandedSections.bindables ? 'open' : ''}"></span>
            <span class="section-title">Bindables</span>
            <span class="section-count">${selectedElement.bindables.length}</span>
          </button>
          <div if.bind="expandedSections.bindables" class="section-body">
            <property-list properties.bind="selectedElement.bindables" owner.bind="selectedElement" editable.bind="true"></property-list>
          </div>
        </section>

        <section if.bind="hasProperties" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.properties}" click.trigger="toggleSection('properties')">
            <span class="disclosure ${expandedSections.properties ? 'open' : ''}"></span>
            <span class="section-title">Properties</span>
            <span class="section-count">${selectedElement.properties.length}</span>
          </button>
          <div if.bind="expandedSections.properties" class="section-body">
            <property-list properties.bind="selectedElement.properties" owner.bind="selectedElement" editable.bind="true"></property-list>
          </div>
        </section>

        <section if.bind="hasOverrideContext" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.context}" click.trigger="toggleSection('context')">
            <span class="disclosure ${expandedSections.context ? 'open' : ''}"></span>
            <span class="section-title">Repeat context</span>
            <span class="section-count">${selectedElement.overrideContext.length}</span>
          </button>
          <div if.bind="expandedSections.context" class="section-body">
            <property-list properties.bind="selectedElement.overrideContext" owner.bind="selectedElement"></property-list>
          </div>
        </section>

        <section if.bind="hasController" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.controller}" click.trigger="toggleSection('controller')">
            <span class="disclosure ${expandedSections.controller ? 'open' : ''}"></span>
            <span class="section-title">Controller</span>
            <span class="section-count">${selectedElement.controller.properties.length}</span>
          </button>
          <div if.bind="expandedSections.controller" class="section-body">
            <property-list properties.bind="selectedElement.controller.properties" copyable.bind="false"></property-list>
          </div>
        </section>

        <section if.bind="hasCustomAttributes" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.attributes}" click.trigger="toggleSection('attributes')">
            <span class="disclosure ${expandedSections.attributes ? 'open' : ''}"></span>
            <span class="section-title">Custom attributes</span>
            <span class="section-count">${selectedElementAttributes.length}</span>
          </button>
          <div if.bind="expandedSections.attributes" class="section-body">
            <div repeat.for="attr of selectedElementAttributes" class="attribute-group">
              <div class="attribute-name">${attr.name}</div>
              <property-list properties.bind="attr.bindables" owner.bind="attr"></property-list>
            </div>
          </div>
        </section>

        <section if.bind="hasLifecycleHooks" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.lifecycle}" click.trigger="toggleSection('lifecycle')">
            <span class="disclosure ${expandedSections.lifecycle ? 'open' : ''}"></span>
            <span class="section-title">Lifecycle hooks</span>
            <span class="section-count">${implementedHooksCount}/${totalHooksCount}</span>
          </button>
          <div if.bind="expandedSections.lifecycle" class="section-body">
            <div repeat.for="hook of lifecycleHooks.hooks" class="hook-row ${hook.implemented ? 'on' : 'off'}">
              <span class="hook-mark" aria-hidden="true"></span>
              <span class="hook-name">${hook.name}</span>
              <span if.bind="hook.isAsync" class="hook-async">async</span>
            </div>
          </div>
        </section>

        <section if.bind="hasComputedProperties" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.computed}" click.trigger="toggleSection('computed')">
            <span class="disclosure ${expandedSections.computed ? 'open' : ''}"></span>
            <span class="section-title">Computed</span>
            <span class="section-count">${computedProperties.length}</span>
          </button>
          <div if.bind="expandedSections.computed" class="section-body">
            <div repeat.for="computed of computedProperties" class="computed-row">
              <span class="property-name">${computed.name}</span>
              <span class="computed-kind">${computed.hasGetter ? 'get' : ''}${computed.hasSetter ? ' set' : ''}</span>
            </div>
          </div>
        </section>

        <section if.bind="isEnhancedDI" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.dependencies}" click.trigger="toggleSection('dependencies')">
            <span class="disclosure ${expandedSections.dependencies ? 'open' : ''}"></span>
            <span class="section-title">Dependency injection</span>
            <span if.bind="hasEnhancedDependencies" class="section-count">${enhancedDI.dependencies.length}</span>
          </button>
          <div if.bind="expandedSections.dependencies" class="section-body">
            <div if.bind="hasEnhancedDependencies" class="group">
              <div class="group-title">Injected</div>
              <div repeat.for="dep of enhancedDI.dependencies" class="dep-row">
                <div class="dep-main">
                  <span class="dep-glyph ${dep.type}" aria-hidden="true"></span>
                  <span if.bind="dep.instanceName" class="dep-name">${dep.instanceName}</span>
                  <span else class="dep-key">${dep.name}</span>
                </div>
                <div if.bind="dep.instancePreview" class="dep-preview">
                  <span repeat.for="pair of previewRows(dep.instancePreview)" class="preview-pair">
                    <span class="preview-key">${pair.key}:</span>
                    <span class="preview-val">${pair.value}</span>
                  </span>
                </div>
              </div>
            </div>

            <div if.bind="hasContainerHierarchy" class="group">
              <div class="group-title">Container hierarchy</div>
              <div class="container-tree">
                <div repeat.for="ancestor of containerAncestorsReversed" class="container-node" style="padding-left: ${$index * 12}px">
                  <span class="container-marker ${ancestor.isRoot ? 'root' : ''}" aria-hidden="true"></span>
                  <span if.bind="ancestor.ownerName" class="container-owner">${ancestor.ownerName}</span>
                  <span else class="container-id">#${ancestor.id}</span>
                </div>
                <div class="container-node current" style="padding-left: ${containerAncestorsReversed.length * 12}px">
                  <span class="container-marker current" aria-hidden="true"></span>
                  <span class="container-owner">${currentContainerLabel}</span>
                </div>
              </div>
            </div>

            <div if.bind="availableServicesCount > 0" class="group">
              <button type="button" class="group-title group-toggle" aria-expanded="${showAvailableServices}" click.trigger="toggleAvailableServices()">
                <span class="disclosure ${showAvailableServices ? 'open' : ''}"></span>
                Available services
                <span class="section-count">${availableServicesCount}</span>
              </button>
              <div if.bind="showAvailableServices" class="services-list">
                <div repeat.for="svc of enhancedDI.availableServices" class="service-row">
                  <span class="dep-glyph ${svc.type}" aria-hidden="true"></span>
                  <span class="service-name">${svc.name}</span>
                  <span if.bind="svc.isFromAncestor" class="inherited" title="Registered on an ancestor container">inherited</span>
                </div>
              </div>
            </div>

            <div if.bind="!hasAnyDIInfo" class="empty small">No dependency information available.</div>
          </div>
        </section>

        <section if.bind="!isEnhancedDI && hasDependencies" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.dependencies}" click.trigger="toggleSection('dependencies')">
            <span class="disclosure ${expandedSections.dependencies ? 'open' : ''}"></span>
            <span class="section-title">Dependencies</span>
            <span class="section-count">${dependencies.dependencies.length}</span>
          </button>
          <div if.bind="expandedSections.dependencies" class="section-body">
            <div repeat.for="dep of dependencies.dependencies" class="dep-row simple">
              <span class="dep-glyph ${dep.type}" aria-hidden="true"></span>
              <span class="dep-name">${dep.name}</span>
            </div>
          </div>
        </section>

        <section if.bind="hasRouteInfo" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.route}" click.trigger="toggleSection('route')">
            <span class="disclosure ${expandedSections.route ? 'open' : ''}"></span>
            <span class="section-title">Route</span>
          </button>
          <div if.bind="expandedSections.route" class="section-body route">
            <div class="route-path">${routeInfo.currentRoute}</div>
            <div if.bind="routeInfo.params.length" class="route-params">
              <span repeat.for="param of routeInfo.params" class="route-param">
                <span class="property-name">${param.name}</span><span class="property-colon">:</span> <span class="type-string">${param.value}</span>
              </span>
            </div>
          </div>
        </section>

        <section if.bind="hasSlots" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.slots}" click.trigger="toggleSection('slots')">
            <span class="disclosure ${expandedSections.slots ? 'open' : ''}"></span>
            <span class="section-title">Slots</span>
            <span class="section-count">${activeSlotCount}/${slotInfo.slots.length}</span>
          </button>
          <div if.bind="expandedSections.slots" class="section-body">
            <div repeat.for="slot of slotInfo.slots" class="slot-row ${slot.hasContent ? 'filled' : 'empty-slot'}">
              <span class="slot-mark" aria-hidden="true"></span>
              <span class="slot-name">${slot.name || 'default'}</span>
              <span class="slot-state">${slot.hasContent ? 'projected' : 'empty'}</span>
            </div>
          </div>
        </section>

        <section if.bind="hasTemplateInfo" class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.template}" click.trigger="toggleSection('template')">
            <span class="disclosure ${expandedSections.template ? 'open' : ''}"></span>
            <span class="section-title">Template</span>
            <span class="section-count">${templateBindingsCount + templateControllersCount}</span>
          </button>
          <div if.bind="expandedSections.template" class="section-body">
            <div if.bind="templateBindingsCount > 0" class="group">
              <div class="group-title">Bindings <span class="section-count">${templateBindingsCount}</span></div>
              <div repeat.for="binding of templateBindings"
                   class="binding-row ${binding.type} ${expandedBindingIds[binding.id] ? 'open' : ''}"
                   click.trigger="toggleBindingExpand(binding)">
                <div class="binding-head">
                  <span class="binding-kind">${bindingTypeLabel(binding.type)}</span>
                  <span class="binding-target">${binding.target}</span>
                  <span class="binding-mode ${bindingModeClass(binding.mode)}" title="${binding.mode || 'default'}">${bindingModeLabel(binding.mode)}</span>
                  <span class="binding-expr">${binding.expression}</span>
                </div>
                <div if.bind="expandedBindingIds[binding.id]" class="detail">
                  <div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">${binding.type}</span></div>
                  <div class="detail-row"><span class="detail-label">Mode</span><span class="detail-value">${binding.mode || 'default'}</span></div>
                  <div class="detail-row"><span class="detail-label">Value</span><span class="detail-value ${binding.valueType}">${formatBindingValue(binding.value)}</span></div>
                  <div class="detail-row"><span class="detail-label">Bound</span><span class="detail-value">${binding.isBound ? 'yes' : 'no'}</span></div>
                </div>
              </div>
            </div>

            <div if.bind="templateControllersCount > 0" class="group">
              <div class="group-title">Template controllers <span class="section-count">${templateControllersCount}</span></div>
              <div repeat.for="ctrl of templateControllers"
                   class="controller-row ${ctrl.type} ${ctrl.isActive ? 'active' : 'inactive'} ${expandedControllerIds[ctrl.id] ? 'open' : ''}"
                   click.trigger="toggleControllerExpand(ctrl)">
                <div class="controller-head">
                  <span class="controller-type">${ctrl.type}</span>
                  <span if.bind="ctrl.expression" class="controller-expr">${ctrl.expression}</span>
                  <span class="controller-state">${ctrl.isActive ? 'active' : 'inactive'}</span>
                </div>
                <div if.bind="expandedControllerIds[ctrl.id]" class="detail">
                  <div if.bind="isConditionalController(ctrl)" class="detail-row">
                    <span class="detail-label">Condition</span><span class="detail-value type-boolean">${ctrl.condition}</span>
                  </div>
                  <div if.bind="ctrl.cachedViews" class="detail-row">
                    <span class="detail-label">Cached views</span><span class="detail-value type-number">${ctrl.cachedViews}</span>
                  </div>
                  <div if.bind="ctrl.type === 'repeat'" class="detail-row">
                    <span class="detail-label">Variable</span><span class="detail-value type-string">${ctrl.localVariable}</span>
                  </div>
                  <div if.bind="ctrl.type === 'repeat'" class="detail-row">
                    <span class="detail-label">Items</span><span class="detail-value type-number">${ctrl.itemCount}</span>
                  </div>
                  <div if.bind="hasRepeatItems(ctrl)" class="repeat-items">
                    <div repeat.for="item of ctrl.items" class="repeat-item">
                      <span class="item-index">[${item.index}]</span>
                      <span class="item-value">${item.value}</span>
                      <span class="item-flags">
                        <span if.bind="item.isFirst" class="item-flag">first</span>
                        <span if.bind="item.isLast" class="item-flag">last</span>
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div if.bind="hasTemplateMeta" class="template-meta">
              <span if.bind="templateSnapshot.hasSlots" class="meta-tag">has slots</span>
              <span if.bind="templateSnapshot.shadowMode !== 'none'" class="meta-tag">${templateSnapshot.shadowMode} shadow DOM</span>
              <span if.bind="templateSnapshot.isContainerless" class="meta-tag">containerless</span>
            </div>
          </div>
        </section>

        <section class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.expression}" click.trigger="toggleSection('expression')">
            <span class="disclosure ${expandedSections.expression ? 'open' : ''}"></span>
            <span class="section-title">Evaluate</span>
          </button>
          <div if.bind="expandedSections.expression" class="section-body evaluate">
            <div class="evaluate-form">
              <input type="text"
                     class="expression-input"
                     placeholder="this.propertyName"
                     aria-label="Expression to evaluate in the component"
                     autocomplete="off"
                     spellcheck="false"
                     value.bind="expressionInput"
                     keydown.trigger="onExpressionKeydown($event)">
              <button type="button" class="run-btn" disabled.bind="!canEvaluate" click.trigger="evaluateExpression()">Run</button>
            </div>
            <div if.bind="expressionError" class="expression-error" role="alert">${expressionError}</div>
            <div if.bind="expressionResult" class="expression-result">
              <span class="result-type">${expressionResultType}</span>
              <pre class="result-value">${expressionResult}</pre>
            </div>
            <div if.bind="expressionHistory.length" class="expression-history">
              <button repeat.for="expr of expressionHistory"
                      type="button"
                      class="history-item"
                      click.trigger="selectHistoryExpression(expr)">${expr}</button>
            </div>
          </div>
        </section>

        <section class="section">
          <button type="button" class="section-header" aria-expanded="${expandedSections.timeline}" click.trigger="toggleSection('timeline')">
            <span class="disclosure ${expandedSections.timeline ? 'open' : ''}"></span>
            <span class="section-title">Timeline</span>
            <span if.bind="hasTimelineEvents" class="section-count">${timelineEventCount}</span>
            <span if.bind="isRecording" class="recording-dot" title="Recording" aria-label="Recording"></span>
          </button>
          <div if.bind="expandedSections.timeline" class="section-body timeline">
            <div class="timeline-controls">
              <button if.bind="!isRecording" type="button" class="text-btn" click.trigger="startRecording()">Record</button>
              <button if.bind="isRecording" type="button" class="text-btn recording" click.trigger="stopRecording()">Stop</button>
              <button type="button" class="text-btn" disabled.bind="!canClearTimeline" click.trigger="clearTimeline()">Clear</button>
            </div>
            <div if.bind="!hasTimelineEvents && !isRecording" class="empty small">Record to capture event handlers and navigations as they happen.</div>
            <div if.bind="isRecording && !hasTimelineEvents" class="empty small">Recording. Interact with the page to capture events.</div>
            <div if.bind="hasTimelineEvents" class="timeline-events">
              <div repeat.for="event of timelineEvents"
                   class="timeline-event ${timelineEventClass(event)} ${expandedTimelineIds[event.id] ? 'open' : ''}"
                   click.trigger="toggleTimelineEvent(event)">
                <div class="event-head">
                  <span class="event-time">${formatTimelineTimestamp(event.timestamp)}</span>
                  <span class="event-name">${event.eventName}</span>
                  <button if.bind="event.vmName"
                          type="button"
                          class="event-component"
                          title="Select this component"
                          click.trigger="selectTimelineComponent(event, $event)">${event.vmName}</button>
                  <span if.bind="event.handlerName" class="event-handler">${event.handlerName}</span>
                  <span if.bind="event.duration" class="event-duration">${event.duration} ms</span>
                </div>
                <div if.bind="expandedTimelineIds[event.id]" class="detail">
                  <div if.bind="event.before" class="snapshot">
                    <span class="detail-label">Before</span>
                    <div class="snapshot-rows">
                      <span repeat.for="row of snapshotRows(event.before)" class="snapshot-row">${row.key}: ${row.value}</span>
                    </div>
                  </div>
                  <div if.bind="event.after" class="snapshot">
                    <span class="detail-label">After</span>
                    <div class="snapshot-rows">
                      <span repeat.for="row of snapshotRows(event.after)" class="snapshot-row">${row.key}: ${row.value}</span>
                    </div>
                  </div>
                  <div if.bind="event.error" class="event-error">${event.error}</div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</template>
